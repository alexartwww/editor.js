<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editor.js 🤩🧦🤨 example</title>
  <link href="https://fonts.googleapis.com/css?family=PT+Mono" rel="stylesheet">
  <link href="/assets/demo.css" rel="stylesheet">
  <script src="/assets/json-preview.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add("dark-mode");
    }
  </script>
  <div class="ce-example">
    <div class="ce-example__header">
      <a class="ce-example__header-logo" href="https://codex.so/editor">Editor.js 🤩🧦🤨</a>

      <div class="ce-example__header-menu">
        <a href="https://github.com/editor-js" target="_blank">Plugins</a>
        <a href="https://editorjs.io/usage" target="_blank">Usage</a>
        <a href="https://editorjs.io/configuration" target="_blank">Configuration</a>
        <a href="https://editorjs.io/creating-a-block-tool" target="_blank">API</a>
      </div>
    </div>
    <div class="ce-example__content">
      <div id="editorjs"></div>
      <div class="ce-example__button" id="saveButton">
        editor.save()
      </div>
      <div class="ce-example__statusbar">
        <div class="ce-example__statusbar-item">
          Readonly:
          <b id="readonly-state">
            Off
          </b>
          &nbsp;
          <div class="ce-example__statusbar-button" id="toggleReadOnlyButton">
            toggle
          </div>
        </div>
        <div class="ce-example__statusbar-item">
          <div class="ce-example__statusbar-button" id="showBlocksBoundariesButton">
            <span data-toggled-text="Hide">Show</span>
            blocks boundaries
          </div>
        </div>
        <div class="ce-example__statusbar-item">
          <div class="ce-example__statusbar-button" id="enableThinModeButton">
            <span data-toggled-text="Disable">Enable</span>
            thin mode
          </div>
        </div>
        <div class="ce-example__statusbar-item ce-example__statusbar-item--right">
          <div class="ce-example__statusbar-toggler" id="darkThemeToggler">
          </div>
        </div>
      </div>
    </div>
    <div class="ce-example__output">
      <pre class="ce-example__output-content" id="output"></pre>

      <div class="ce-example__output-footer">
        <a href="https://codex.so" style="font-weight: bold;">Made by CodeX</a>
      </div>
    </div>
  </div>


  <!-- Load Tools -->
  <!--
    You can upload Tools to your project's directory and connect them by relative links.

    Also you can load each Tool from CDN or use NPM/Yarn packages.

    Read more at Tools Connection doc:
    https://editorjs.io/getting-started#tools-connection
  -->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>&lt;!&ndash; Header &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/simple-image@latest"></script>&lt;!&ndash; Image &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>&lt;!&ndash; Delimiter &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@latest"></script>&lt;!&ndash; List &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@latest"></script>&lt;!&ndash; Checklist &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>&lt;!&ndash; Quote &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/code@latest"></script>&lt;!&ndash; Code &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/embed@latest"></script>&lt;!&ndash; Embed &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>&lt;!&ndash; Table &ndash;&gt;-->

<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/raw@latest"></script>&lt;!&ndash; Raw &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>&lt;!&ndash; Marker &ndash;&gt;-->
<!--  <script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@latest"></script>&lt;!&ndash; Inline Code &ndash;&gt;-->

  <!-- Initialization -->
  <script type="module">
    import EditorJS from './src/codex.ts';
    import Header from './src/tools/header/index.ts';
    import SimpleImage from './src/tools/simple-image/index.js';
    import Delimiter from './src/tools/delimiter/index.ts';
    import NestedList from './src/tools/list/index.ts';
    import Checklist from './src/tools/list/index.ts';
    import Quote from './src/tools/quote/index.ts';
    import CodeTool from './src/tools/code/index.ts';
    import Embed from './src/tools/embed/index.ts';
    import Table from './src/tools/table/index.js';
    import LinkTool from './src/tools/link/index.js';
    import Warning from './src/tools/warning/index.ts';
    import RawTool from './src/tools/raw/index.js';
    import Marker from './src/tools/marker/index.js';
    import InlineCode from './src/tools/inline-code/index.ts';

    window.EditorJS = EditorJS;

    /**
     * To initialize the Editor, create a new instance with configuration object
     * @see docs/installation.md for mode details
     */
    const editorConfig = {
      /**
       * Enable/Disable the read only mode
       */
      readOnly: false,

      /**
       * Wrapper of Editor
       */
      holder: 'editorjs',

      /**
       * Common Inline Toolbar settings
       * - if true (or not specified), the order from 'tool' property will be used
       * - if an array of tool names, this order will be used
       */
      // inlineToolbar: ['link', 'marker', 'bold', 'italic'],
      // inlineToolbar: true,
      placeholder: 'Введите текст или нажмите “/” для вызова меню',
      autofocus: true,

      /**
       * Tools list
       */
      tools: {
        /**
         * Each Tool is a Plugin. Pass them via 'class' option with necessary settings {@link docs/tools.md}
         */
        header: {
          class: Header,
          inlineToolbar: ['link', 'marker'],
          config: {
            placeholder: 'Заголовок',
            placeholderLevel: 'Подзаголовок',
            levels: [1, 2, 3],
            defaultLevel: 1,
            holdFirstHeader: true,
            maxLength: 150,
            maxLengthLevel: 200,
          },
          shortcut: 'CMD+SHIFT+H'
        },

        /**
         * Or pass class directly without any configuration
         */
        image: SimpleImage,

        list: {
          class: NestedList,
          inlineToolbar: true,
          shortcut: 'CMD+SHIFT+L'
        },

        checklist: {
          class: Checklist,
          inlineToolbar: true,
        },

        quote: {
          class: Quote,
          inlineToolbar: true,
          config: {
            quotePlaceholder: 'Enter a quote',
            captionPlaceholder: 'Enter a caption',
            holdOnLastBackspace: true,
          },
          shortcut: 'CMD+SHIFT+O'
        },

        warning: Warning,

        marker: {
          class:  Marker,
          shortcut: 'CMD+SHIFT+M'
        },

        code: {
          class:  CodeTool,
          shortcut: 'CMD+SHIFT+C'
        },

        delimiter: Delimiter,

        inlineCode: {
          class: InlineCode,
          shortcut: 'CMD+SHIFT+C'
        },

        linkTool: LinkTool,

        raw: RawTool,

        embed: Embed,

        table: {
          class: Table,
          inlineToolbar: true,
          shortcut: 'CMD+ALT+T'
        },

      },

      /**
       * This Tool will be used as default
       */
      // defaultBlock: 'paragraph',


      /**
       * Initial Editor data
       */
      data: {
        blocks: [
          {
            id: "zcKCF1S7X8",
            type: "header",
            data: {
              text: "",
              level: 1
            }
          },
          {
            id: "b6ji-DvaKb",
            type: "paragraph",
            data: {
              text: ""
            }
          },
          {
            type: "header",
            id: "7ItVl5biRo",
            data: {
              text: "Key features",
              level: 2
            }
          },
          {
            type : 'list',
            id: "SSBSguGvP7",
            data : {
              items : [
                {
                  content: 'It is a block-styled editor',
                  items: []
                },
                {
                  content: 'It returns clean data output in JSON',
                  items: []
                },
                {
                  content: 'Designed to be extendable and pluggable with a simple API',
                  items: []
                }
              ],
              style: 'unordered'
            }
          },
        ]
      },
      onReady: function(){
        saveButton.click();
      },
      onChange: function(api, event) {
        console.log('something changed', event);
      },

      i18n: {
        /**
         * @type {I18nDictionary}
         */
        messages: {
          /**
           * Other below: translation of different UI components of the editor.js core
           */
          ui: {
            blockTunes: {
              toggler: {
                'Click to tune': 'Нажмите, чтобы настроить',
                'or drag to move': 'или перетащите',
              },
            },
            inlineToolbar: {
              converter: {
                'Convert to': 'Конвертировать в',
              },
            },
            toolbar: {
              toolbox: {
                Add: 'Добавить',
              },
            },
            popover: {
              Filter: 'Фильтр',
              'Nothing found': 'Не найдено',
              'Convert to': 'Конвертировать в',
            },
          },

          /**
           * Section for translation Tool Names: both block and inline tools
           */
          toolNames: {
            Text: 'Параграф',
            Heading: 'Заголовок',
            List: 'Список',
            Warning: 'Примечание',
            Checklist: 'Чеклист',
            'Unordered List': 'Список',
            'Ordered List': 'Нум. Список',
            Images: 'Фотографии',
            Buttons: 'Кнопки',
            Video: 'Видео',
            Cut: 'Линия отреза',
            Quote: 'Цитата',
            Code: 'Код',
            Delimiter: 'Разделитель',
            'Raw HTML': 'HTML-фрагмент',
            Table: 'Таблица',
            Link: 'Ссылка',
            Marker: 'Маркер',
            Bold: 'Полужирный',
            Italic: 'Курсив',
            InlineCode: 'Моноширинный',
          },

          /**
           * Section for passing translations to the external tools classes
           */
          tools: {
            /**
             * Each subsection is the i18n dictionary that will be passed to the corresponded plugin
             * The name of a plugin should be equal the name you specify in the 'tool' section for that plugin
             */
            warning: {
              // <-- 'Warning' tool will accept this dictionary section
              Title: 'Название',
              Message: 'Сообщение',
            },

            /**
             * Link is the internal Inline Tool
             */
            link: {
              'Add a link': 'Вставьте ссылку',
            },
            /**
             * The "stub" is an internal block tool, used to fit blocks that does not have the corresponded plugin
             */
            stub: {
              'The block can not be displayed correctly.': 'Блок не может быть отображен',
            },
            list: {
              'Ordered': 'Нум. Список',
              'Unordered': 'Список',
              'Checklist': 'Чеклист',
              'Start with': 'Начать с',
              'Counter type': 'Тип нумерации',
              'Numeric': 'Нумерованный',
              'Lower Roman': 'Римские строчные',
              'Upper Roman': 'Римские заглавные',
              'Lower Alpha': 'Латинские строчные',
              'Upper Alpha': 'Латинские заглавные',
            },
            quote: {
              'Enter a quote': 'Введите цитату',
              'Enter a caption': 'Введите подпись',
            },
            header: {
              'Heading 1': 'Заголовок 1',
              'Heading 2': 'Заголовок 2',
              'Heading 3': 'Заголовок 3',
              'Heading 4': 'Заголовок 4',
              'Heading 5': 'Заголовок 5',
              'Heading 6': 'Заголовок 6',
            },
            table: {
              'Add column to left': 'Добавить колонку слева',
              'Add column to right': 'Добавить колонку справа',
              'Delete column': 'Удалить колонку',
              'Add row above': 'Добавить строку выше',
              'Add row below': 'Добавить строку ниже',
              'Delete row': 'Удалить строку',
              Heading: 'Заголовок',
              'With headings': 'С заголовком',
            },
            xvideo: {
              'Video has not been selected': 'Видео не было выбрано',
              'Select video': 'Указать URL видео(Rutube, VK, Vimeo, YouTube)',
              Caption: 'Подпись к видео',
            },
            ximages: {
              'Files has not been selected': 'Файлы не были выбраны',
              'Add files from your device': 'Добавьте файлы со своего устройства',
              'Select files': 'Выбрать файлы',
              'Caption for image': 'Подпись к изображению',
              'Caption for images': 'Подпись к изображениям',
            },
            xbuttons: {
              Buttons: 'Кнопки',
            },
          },

          /**
           * Section allows to translate Block Tunes
           */
          blockTunes: {
            /**
             * Each subsection is the i18n dictionary that will be passed to the corresponded Block Tune plugin
             * The name of a plugin should be equal the name you specify in the 'tunes' section for that plugin
             *
             * Also, there are few internal block tunes: "delete", "moveUp" and "moveDown"
             */
            delete: {
              Delete: 'Удалить',
              'Click to delete': 'Уверены?',
            },
            moveUp: {
              'Move up': 'Переместить вверх',
            },
            moveDown: {
              'Move down': 'Переместить вниз',
            },
          },
        },
      },
    }
    /**
    * To initialize the Editor, create a new instance with configuration object
    * @see docs/installation.md for mode details
    */
    var editor = new EditorJS(editorConfig);

    /**
    * Saving button
    */
    const saveButton = document.getElementById('saveButton');

    /**
    * Toggle read-only button
    */
    const toggleReadOnlyButton = document.getElementById('toggleReadOnlyButton');
    const readOnlyIndicator = document.getElementById('readonly-state');

    /**
    * Saving example
    */
    saveButton.addEventListener('click', function () {
      editor.save()
        .then((savedData) => {
          cPreview.show(savedData, document.getElementById("output"));
        })
        .catch((error) => {
          console.error('Saving error', error);
        });
    });

    /**
    * Toggle read-only example
    */
    toggleReadOnlyButton.addEventListener('click', async () => {
      const readOnlyState = await editor.readOnly.toggle();

      readOnlyIndicator.textContent = readOnlyState ? 'On' : 'Off';
    });

    /**
    * Button for displaying blocks borders. Useful for UI development
    */
    const showBlocksBoundariesButton = document.getElementById("showBlocksBoundariesButton");

    showBlocksBoundariesButton.addEventListener('click', () => {
      document.body.classList.toggle("show-block-boundaries")
    })

    /**
    * Button for enabling the 'Thin' mode
    */
    const enableThinModeButton = document.getElementById("enableThinModeButton");

    enableThinModeButton.addEventListener('click', () => {
      document.body.classList.toggle("thin-mode")

      editor.destroy();

      editor = new EditorJS(editorConfig);
    })

    /**
    * Toggler for toggling the dark mode
    */
    const darkThemeToggler = document.getElementById("darkThemeToggler");

    darkThemeToggler.addEventListener('click', () => {
      document.body.classList.toggle("dark-mode");

      localStorage.setItem('theme', document.body.classList.contains("dark-mode") ? 'dark' : 'default');
    })

    window.editor = editor;
  </script>
</body>
</html>
